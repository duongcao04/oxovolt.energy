<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/png"
            href="/favicon-96x96.png"
            sizes="96x96"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <meta name="apple-mobile-web-app-title" content="Oxovolt Energy" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary Meta Tags -->
        <title>Oxovolt Energy</title>
        <meta name="title" content="Oxovolt Energy" />
        <meta
            name="description"
            content="Advanced energy infrastructure combining battery systems, embedded intelligence, resilient power electronics, distributed connectivity and data cloud technologies designed for resilient and uninterrupted operations."
        />
        <meta
            name="keywords"
            content="Oxovolt, Energy, Kameleo, LoopXcell, Renewable Energy, Power Solutions"
        />
        <meta name="author" content="Oxovolt Energy" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://oxovolt.com/" />
        <meta property="og:title" content="Oxovolt Energy" />
        <meta
            property="og:description"
            content="Advanced energy infrastructure combining battery systems, embedded intelligence, resilient power electronics, distributed connectivity and data cloud technologies designed for resilient and uninterrupted operations."
        />
        <meta property="og:image" content="https://oxovolt.com/og-image.webp" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://oxovolt.com/" />
        <meta property="twitter:title" content="Oxovolt Energy" />
        <meta
            property="twitter:description"
            content="Advanced energy infrastructure combining battery systems, embedded intelligence, resilient power electronics, distributed connectivity and data cloud technologies designed for resilient and uninterrupted operations."
        />
        <meta
            property="twitter:image"
            content="https://oxovolt.com/og-image.webp"
        />

        <meta name="robots" content="index, follow, max-image-preview:large" />

        <meta
            name="theme-color"
            content="#ffffff"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#000000"
            media="(prefers-color-scheme: dark)"
        />

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />

        <!-- Canonical Link -->
        <link rel="canonical" href="https://oxovolt.com/" />

        <!-- Web Manifest -->
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#ffffff" />

        <!-- Sitemap -->
        <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

        <!-- Font Preloads -->
        <link rel="preload" href="/fonts/GoogleSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
        <link rel="preload" href="/fonts/GoogleSans-Bold.ttf" as="font" type="font/ttf" crossorigin />
        <link rel="preload" href="/fonts/GoogleSans-Medium.ttf" as="font" type="font/ttf" crossorigin />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>

        <!-- Schema tĩnh cho Organization -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "Oxovolt Energy",
                "url": "https://oxovolt.com",
                "logo": "https://oxovolt.com/logo.webp",
                "industry": "Energy Storage",
                "description": "Advanced immersed LFP energy systems",
                "sameAs": [
                    "https://linkedin.com/company/oxovolt",
                    "https://twitter.com/oxovolt"
                ]
            }
        </script>
    </body>
</html>
